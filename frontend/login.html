<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — WeekdayAI Recruiter Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #090d16;
      font-family: 'Inter', sans-serif;
      color: #e2e8f0;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 40px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .login-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      justify-content: center;
    }
    .login-logo {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }
    .login-title {
      font-family: 'Outfit', sans-serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: white;
    }
    .login-subtitle {
      font-size: 14px;
      color: #94a3b8;
      text-align: center;
      margin-bottom: 32px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 8px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      color: white;
      font-size: 14px;
      outline: none;
      box-sizing: border-box;
      transition: all 0.2s;
    }
    .form-group input:focus {
      border-color: #8b5cf6;
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
    }
    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.2s;
    }
    .btn-login:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    .login-error {
      color: #ef4444;
      font-size: 13px;
      text-align: center;
      margin-top: 16px;
      display: none;
    }
    .quick-accounts {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 12px;
      color: #64748b;
      text-align: center;
    }
    .quick-pill {
      display: inline-block;
      padding: 4px 10px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      margin: 4px;
      cursor: pointer;
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .quick-pill:hover {
      background: rgba(139, 92, 246, 0.2);
      color: white;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-brand">
      <div class="login-logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </div>
      <span class="login-title">WeekdayAI</span>
    </div>
    <div class="login-subtitle">Account Manager &amp; Recruiter Workspace</div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="email">Work Email</label>
        <input type="email" id="email" placeholder="admin@weekday.cx" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn-login" id="btnLogin">Sign In to Workspace &rarr;</button>
      <div id="loginError" class="login-error"></div>
    </form>

    <div class="quick-accounts">
      <div>Quick Login Credentials:</div>
      <span class="quick-pill" onclick="fillCreds('admin@weekday.cx', 'weekday@123')">👑 Surad (Admin)</span>
      <span class="quick-pill" onclick="fillCreds('priya@weekday.cx', 'weekday@123')">👤 Priya (AM)</span>
      <span class="quick-pill" onclick="fillCreds('rohan@weekday.cx', 'weekday@123')">👤 Rohan (AM)</span>
    </div>
  </div>

  <script>
    function fillCreds(email, pass) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = pass;
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('loginError');
      const btn = document.getElementById('btnLogin');

      errorDiv.style.display = 'none';
      btn.innerText = 'Signing in...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');

        localStorage.setItem('weekday_token', data.token);
        localStorage.setItem('weekday_user', JSON.stringify(data.user));
        window.location.href = '/';
      } catch (err) {
        errorDiv.innerText = err.message;
        errorDiv.style.display = 'block';
        btn.innerText = 'Sign In to Workspace →';
      }
    }
  </script>
</body>
</html>
